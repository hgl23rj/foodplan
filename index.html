<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TBCA Web</title>
    <link rel="stylesheet" href="./styles.css">
<script src="./app.js" type="module"></script>

  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <img id="brand-logo" alt="TBCA logo" />
        <span class="brand-name">TBCA</span>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <p class="eyebrow">Portal</p>
        <h1>Bem-vindo ao TBCA</h1>
        <p class="lead">
          Acesso rápido às principais informações e páginas do portal institucional.
        </p>
      </section>

      <section id="app" class="content" aria-live="polite"></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
